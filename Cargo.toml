[workspace]
resolver = "3"
members = [
  "crates/wcmd-agents",
  "crates/wcmd-app",
  "crates/wcmd-config",
  "crates/wcmd-pty",
  "crates/wcmd-state",
  "crates/wcmd-term",
  "tools/release",
]
exclude = ["third_party/portable-pty"]

[workspace.package]
version = "0.7.1-beta.1"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
repository = "https://github.com/wolfknight949/wolfcmd"

[workspace.dependencies]
wcmd-agents = { path = "crates/wcmd-agents" }
wcmd-config = { path = "crates/wcmd-config" }
wcmd-pty = { path = "crates/wcmd-pty" }
wcmd-state = { path = "crates/wcmd-state" }
wcmd-term = { path = "crates/wcmd-term" }
alacritty_terminal = "0.26"
anyhow = "1"
portable-pty = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-single-instance = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "rt", "sync", "time"] }
toml = "0.9"
toml_edit = { version = "0.25", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webview2-com = "0.39"
which = "8"
windows = "0.62"
windows-core = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# ConPTY without PSEUDOCONSOLE_RESIZE_QUIRK, see third_party/portable-pty/WOLFCMD.md.
[patch.crates-io]
portable-pty = { path = "third_party/portable-pty" }
